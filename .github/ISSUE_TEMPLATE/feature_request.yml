name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem you
        are trying to solve so we can evaluate the request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Describe the use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How do you expect the feature to behave? API / CLI / GUI details are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you have tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: References, links, or any other relevant information.
