[project]
name = "tinymlc"
version = "0.1.0"
description = "TinyML Compiler - AI model to C code converter"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = []
dependencies = [
    "ai-edge-litert>=2.1.5",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "tensorflow>=2.21.0",
    "termcolor>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinymlc"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "onnx-graphsurgeon>=0.6.1",
    "onnx2tf>=1.28.8",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "sng4onnx>=2.0.1",
    "tf-keras>=2.21.0",
]

[project.scripts]
tmlc = "tinymlc.cli:main"
