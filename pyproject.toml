[project]
name = "tinymlc"
version = "0.1.0"
description = "TinyML Compiler - Tiny Machine Learning Compiler"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    {name = "Jia Liu", email = "proljc@gmail.com"},
]
dependencies = [
    "ai-edge-litert>=2.1.5",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "tensorflow>=2.21.0",
    "termcolor>=3.3.0",
    "torch>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["TinyMLC", "utils"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "build>=1.5.0",
    "onnx-graphsurgeon>=0.6.1",
    "onnx2tf>=1.28.8",
    "onnxscript>=0.7.0",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "sng4onnx>=2.0.1",
    "tf-keras>=2.21.0",
    "twine>=6.2.0",
]

[project.scripts]
tmlc = "TinyMLC.cli:main"
