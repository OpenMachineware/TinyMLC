[project]
name = "tinymlc"
version = "0.1.0"
description = "TinyML Compiler - AI model to C code converter"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = []
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinymlc"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
]

[project.scripts]
tmlc = "tinymlc.cli:main"
